apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
      annotations:
{{- with .Values.annotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
      containers:
        - name: genai-service-container
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
{{- with .Values.resources }}
            limits:
              cpu: {{ .limits.cpu }}
              memory: {{ .limits.memory }}
            requests:
              cpu: {{ .requests.cpu }}
              memory: {{ .requests.memory }}
{{- end }}
          env:
{{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: genai-service
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
